<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in — Amata</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #6475ff;
    --blue-dim: rgba(100,117,255,0.15);
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: #0a0a0a;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
    text-align: center;
  }

  .logo { margin-bottom: 64px; opacity: 0; animation: fadeUp 0.6s ease 0.1s forwards; }
  .logo img { height: 32px; width: auto; }

  .badge {
    display: inline-block;
    background: var(--blue-dim);
    color: var(--blue);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 100px;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.2s forwards;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -1px;
    color: white;
    margin-bottom: 24px;
    max-width: 600px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.3s forwards;
  }
  h1 em { font-style: italic; color: var(--blue); }

  p {
    font-size: 17px;
    color: rgba(255,255,255,0.5);
    line-height: 1.7;
    max-width: 440px;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.4s forwards;
  }

  .buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.5s forwards;
  }

  .btn-ig {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--blue);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 100px;
    font-size: 15px;
    font-family: var(--sans);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }
  .btn-ig:hover { background: #4f60e8; }
  .btn-ig svg { width: 18px; height: 18px; fill: white; flex-shrink: 0; }

  .btn-home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: rgba(255,255,255,0.6);
    border: 1.5px solid rgba(255,255,255,0.2);
    padding: 14px 28px;
    border-radius: 100px;
    font-size: 15px;
    font-family: var(--sans);
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-home:hover { border-color: rgba(255,255,255,0.6); color: white; }

  .divider {
    width: 1px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, rgba(100,117,255,0.4), transparent);
    margin: 56px auto 0;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.6s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="logo">
    <img src="images/logo.png" alt="Amata">
  </div>

  <div class="badge">You're on the list</div>

  <h1>We'll be in touch<br>before <em>tomorrow night.</em></h1>

  <p>Thank you for requesting an invite. We're reviewing your profile and will reach out shortly with next steps.</p>

  <div class="buttons">
    <a href="https://www.instagram.com/amata_app/" target="_blank" class="btn-ig">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

      </svg>
      Follow us on Instagram
    </a>
    <a href="index.html" class="btn-home">← Back to home</a>
  </div>

  <div class="divider"></div>

</body>
</html>
